# Copy to config.toml and edit. All angles in degrees unless noted.

[site]
latitude = 50.45          # +N  (placeholder - set yours)
longitude = 30.52         # +E
elevation_m = 180
temperature_c = 10        # for refraction
pressure_mbar = 1010
min_altitude = 12         # don't track below this

# What you can actually see, as azimuth/altitude rectangles [az_min, az_max, alt_min, alt_max].
# Azimuth may wrap through north, e.g. [350, 20, ...]. Leave openings empty for an open horizon.
# Use the console ('m') to read off the current azimuth/altitude while pointing at an edge.
[site.sky]
openings = []             # e.g. [[100, 260, 18, 80]] for a south-facing balcony
blockers = []             # e.g. [[168, 176, 0, 90]] for a window frame post

[tle]
url = "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle"
cache = "data/iss.tle"
max_age_hours = 12

# ---- mount -------------------------------------------------------------------
# steps_per_deg = motor_steps * microsteps * gear_ratio * worm_teeth / 360
# EQ3-2 worm wheels: RA 130 teeth, Dec 65 teeth (verify on your mount).
# gear_ratio = motor-to-worm reduction (pulley ratio).
# With 1/16 microstepping: RA 2600 steps/deg, Dec 1300 steps/deg.
[mount]
port = "/dev/ttyUSB0"
baud = 115200
control_hz = 50
max_accel_deg_s2 = 3.0        # per-axis acceleration limit
max_rate_deg_s = 3.0          # per-axis speed limit (also capped by firmware step rate)
firmware_max_step_rate = 9000 # steps/s, firmware hard cap is 9500
axis1_hour_limit = 120        # |axis1| limit from counterweight-down, deg (>90 = counterweight up)
kp_position = 4.0             # 1/s, position error -> rate correction
command_latency_s = 0.02      # serial + firmware ramp latency, compensated by lead

[mount.axis1]                 # RA axis
motor_steps = 200
microsteps = 16               # sent to the firmware (M0-M2 pins) on connect
gear_ratio = 2.25             # pulley ratio from serialSpeed.ino
worm_teeth = 130
reverse = false               # flip so that + moves in sidereal-tracking direction

[mount.axis2]                 # Dec axis
motor_steps = 200
microsteps = 16
gear_ratio = 2.25
worm_teeth = 65
reverse = false               # flip so that + moves toward the pole on side "east_looking"

# ---- cameras -----------------------------------------------------------------
[cameras]
sdk_lib = "/usr/local/lib/libASICamera2.so"

[cameras.guide]               # 9x50 finder + ASI120MM
name_match = "ASI120"
focal_length_mm = 180
pixel_um = 3.75
width = 1280
height = 960
bin = 1
exposure_ms = 2.0
gain = 60
usb_bandwidth = 80
latency_s = 0.01              # extra delay between mid-exposure and frame arrival
detect_sigma = 6.0
detect_min_area = 3

[cameras.main]                # 150/750 + ASI290MC
name_match = "ASI290"
focal_length_mm = 750         # 1500 with 2x Barlow
pixel_um = 2.9
width = 1936
height = 1096
bin = 1
exposure_ms = 1.0
gain = 150
usb_bandwidth = 80
latency_s = 0.01
detect_sigma = 5.0
detect_min_area = 20
bayer = "RGGB"
record = true
record_dir = "captures"

# ---- tracking loop -------------------------------------------------------------
[tracking]
lead_s = 90                   # start slewing to the rise point this early
cross_alpha = 0.35            # alpha-beta gains for cross-track offset
cross_beta = 0.05
time_gain = 0.3               # along-track time-offset integrator gain per update
max_time_offset_s = 20
main_handoff_frames = 3       # consecutive main-camera detections before trusting it
lost_timeout_s = 1.5          # fall back to guide / pure prediction after this
shadow_threshold = 0.25       # sunlit fraction below which we stop believing the cameras
max_offset_jump_arcmin = 25   # reject detections that jump this far once locked (stars, hot pixels)
reacquire_growth_arcmin_per_s = 8   # widen that limit while coasting blind (clouds/obstructions)
max_reacquire_arcmin = 180    # never accept a detection further out than this

[preview]
enabled = true
port = 8080

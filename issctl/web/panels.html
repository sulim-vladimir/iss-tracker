<!-- @panel -->
<div class="panel cam cam-{{name}}"><h2>{{title}} <span id="stat-{{name}}"></span></h2>
<img src="/{{name}}.mjpg" title="click to track this object, double-click to centre it"
 onclick="imgClick('{{name}}',event,this)"
 ondblclick="mnt('centre',{cam:'{{name}}'})">
<div class="ctl"><label>Exposure</label>
 <button onclick="api('/api/exposure',{cam:'{{name}}',factor:0.667})">-</button>
 <input id="exp-{{name}}" onchange="api('/api/exposure',{cam:'{{name}}',ms:this.value})"><span id="expunit-{{name}}">ms</span>
 <button onclick="api('/api/exposure',{cam:'{{name}}',factor:1.5})">+</button>
 <label style="width:auto;margin-left:10px">Gain</label>
 <button onclick="api('/api/gain',{cam:'{{name}}',delta:-25})">-</button>
 <input id="gain-{{name}}" onchange="api('/api/gain',{cam:'{{name}}',value:this.value})">
 <button onclick="api('/api/gain',{cam:'{{name}}',delta:25})">+</button></div>
<div class="ctl"><label>Target</label><span id="sel-{{name}}"></span></div>
<div class="ctl btns">
 <button onclick="api('/api/select',{cam:'{{name}}',clear:1})">Auto</button>{{bore}}{{centre}}{{servo}}</div>
<div class="info" id="info-{{name}}"></div>
{{extra}}</div>

<!-- @centre -->
<button title="move the object to the green cross (where the main camera looks)"
 onclick="mnt('centre',{cam:'NAME'})">LABEL</button>EXTRA
 <button title="calibrate by following the detected target - a star, a planet or a distant lamp. The only mode that can measure the boresight"
 onclick="mnt('calibrate',{cam:'NAME'})">calibrate on target</button>
 <button title="no point source in view? Calibrate by following the scenery itself - the strongest corners anywhere in the frame. Nothing to select first. Measures the image scale, but not the boresight"
 onclick="mnt('calibrate',{cam:'NAME',mode:'scene'})">calibrate on scenery</button>
 <button id="corners-NAME" title="draw the corners that 'calibrate on scenery' would follow. If few or none appear, there is too little structure here - focus it, or point somewhere with more detail"
 onclick="api('/api/corners',{cam:'NAME',on: this.className!=='on' ? 1 : 0})">show corners</button>

<!-- @servo -->
 <button id="servobtn" title="servo mode: follow whatever you click in this image - a satellite, the ISS, a plane - with no orbit and no alignment. Either order works: click the object then press this, or press this then click it (a click always restarts the lock on what you clicked). Shorten the exposure first: 8 ms for the ISS, 50-200 ms for fainter satellites. Stops by itself after servo_give_up_s with nothing detected"
 onclick="mnt(MODE==='track' ? 'untrack' : 'servo', {})">Follow</button>

<!-- @bore -->
 <button id="bore-NAME" title="move the green cross: press this, then click the object sitting in the MIDDLE of the main image - the click snaps to the brightest spot nearby. That is what the boresight means. Only trust it on something a kilometre away or more, or the parallax between the two cameras is wider than the main field"
 onclick="armBoresight('NAME')">set boresight</button>

<!-- @in_frame -->
<button title="move the object to the middle of this image (grey cross)"
 onclick="mnt('centre',{cam:'NAME',where:'frame'})">centre in frame</button>

<!-- @mount -->
<div class="panel box slew"><h2>Slew</h2>
 <div class="pad">
  <button style="grid-area:u" onclick="mnt('jog',{axis:2,dir:1})">&#9650;</button>
  <button style="grid-area:l" onclick="mnt('jog',{axis:1,dir:-1})">&#9664;</button>
  <button style="grid-area:c" onclick="mnt('stop',{})">stop</button>
  <button style="grid-area:r" onclick="mnt('jog',{axis:1,dir:1})">&#9654;</button>
  <button style="grid-area:d" onclick="mnt('jog',{axis:2,dir:-1})">&#9660;</button></div>
 <div class="ctl"><label>Speed</label>
  <select id="speedsel" onchange="mnt('speed',{index:this.value})"></select> °/s</div>
 <div class="ctl"><label>Arrows</label>
  <select id="framesel" onchange="mnt('frame',{frame:this.value})"></select>
  <span id="frame-hint" class="hint"></span></div>
 {{estop}}</div>

<div class="panel box"><h2>Target &amp; tracking</h2>
 <div class="ctl">
  <input id="target" title="star or planet name, 'RAh Dec', '18:36:56 +38:47:01', or 'altaz ALT AZ'"
  placeholder="vega / jupiter" style="width:104px">
  <button onclick="mnt('goto',{target:tgt()})">goto</button>
  <button title="slew back to home: counterweight down, tube along the polar axis. Tracking stops"
  onclick="if(confirm('Slew to home (counterweight down, tube at the pole)?')) mnt('gohome',{})">go home</button>
  <button onclick="mnt('sync',{target:tgt()})">sync</button>
  <button title="solve the guide frame and move this target exactly onto the green cross - works however little the mount knows where it is"
  onclick="mnt('solve_centre',{target:tgt()})">centre by solve</button></div>
 <div class="ctl">
  <button id="siderealbtn" title="follow the stars at sidereal rate"
  onclick="mnt('track',{on: this.className === 'on' ? 0 : 1})">sidereal off</button></div>
 <div class="ctl">
  <button id="trackbtn" title="plan and track the next usable pass of the satellite named on the right - the ISS if it is blank"
  onclick="mnt(MODE==='track' ? 'untrack' : 'track',
    {sat: document.getElementById('trackname').value, pass: document.getElementById('passidx').value})">Track next pass</button>
  <input id="trackname" placeholder="ISS" style="width:96px" title="satellite name or NORAD number (e.g. 42065, NOSS 3-8 (B)) - blank for the ISS">
  <input id="passidx" placeholder="next" style="width:40px" title="pass index from 'issctl passes', or blank for the next usable one"></div>
 <div class="ctl">
  <button title="name the satellite the last session followed, from its log and the satellite catalogues (public and amateur-observed classified ones). Also runs by itself when a session ends"
  onclick="mnt('identify',{})">what was that?</button>
  <button id="identbtn" title="name satellites automatically: live in the guide caption while following, and once more when the session ends. Off saves the Pi a few seconds of work per session; 'what was that?' works either way"
  onclick="mnt('identify_on',{on: this.className === 'on' ? 0 : 1})">naming off</button></div>
 <div class="ctl">
  <button id="motorbtn" onclick="mnt('motors',{on: MOTORS ? 0 : 1})">motors off</button></div></div>


<!-- @status -->
<div class="panel box calib"><h2>Calibration</h2>
 <div class="ctl">
  <button title="DECLARE the current pose to be home. Does not move. Throws the star alignment away - only for when the tube really is at home and the counters are lost"
  onclick="if(confirm('Declare the CURRENT pose as home?\n\nThis does not move the mount. It redefines the counters and throws away the star alignment. To slew back to home, use \'go home\' instead.')) mnt('home',{})">set home</button>
  <button title="calibrate both cameras by following the detected target - the only mode that can measure the guide-&gt;main boresight"
  onclick="mnt('calibrate',{})">both cameras on target</button>
  <button title="calibrate both cameras by following the scenery itself. Nothing to select first. Measures the image scale, but not the boresight"
  onclick="mnt('calibrate',{mode:'scene'})">both cameras on scenery</button></div>
 <div class="ctl">
  <button title="No point source to measure the boresight with? Click the SAME object in the main image and in the guide image, then press this. Only trust it on something a kilometre away or more - nearer than that the parallax between the two cameras is wider than the main field"
  onclick="mnt('boresight',{})">boresight from my picks</button></div>
 <h3>By the stars</h3>
 <div class="ctl">
  <button title="plate-solve the guide frame: where the boresight really points, and what is in view. Changes nothing"
  onclick="mnt('solve',{})">solve</button>
  <button title="set the mount's counters from the solved sky. After pushing the mount by hand, this is all it needs - the alignment is kept"
  onclick="mnt('solve_sync',{})">sync on stars</button>
  <button title="measure the guide camera by solving frames either side of a small move on each axis (star_cal_step_deg, 1 deg by default). Also aligns the mount: goto and pass planning then know how the tripod stands"
  onclick="mnt('starcal',{})">calibrate on stars</button></div>
 <div class="ctl">
  <button title="add this pointing as an alignment star. Points in different parts of the sky make the model better"
  onclick="mnt('align_add',{})">add star</button>
  <button title="with a bright star in the main camera: the solve says which star it is and where it sits in the guide, so the green cross goes exactly there. No parallax - the stars are at infinity"
  onclick="mnt('star_boresight',{})">boresight on star</button>
  <button title="the star is in the guide but not in the main camera: walk a spiral round here, one main field per step, until main sees it (30' by default; Stop cancels)"
  onclick="mnt('spiral',{})">spiral search in main</button>
  <button title="with a star anywhere in the main camera: move each axis 1.8' either way and measure the main matrix in its own pixels (no guide involved), then centre the star. Takes up the Dec slack first"
  onclick="mnt('maincal',{})">calibrate main on star</button>
  <button title="forget the star alignment - only after the tripod itself has moved"
  onclick="if(confirm('Forget the star alignment?')) mnt('align_clear',{})">clear alignment</button></div></div>

<!-- @log -->
<div class="panel box grow"><h2>Log
 <button class="small" title="copy the whole log to the clipboard" onclick="copyLog(this)">copy</button></h2>
 <div class="info" id="log"></div></div>

<!-- @calinfo -->
<div class="panel box grow"><h2>Calibration</h2>
 <div class="info" id="cal-info"></div></div>

<!-- @warnings -->
<div class="panel box grow"><h2>Warnings</h2>
 <div class="info warn" id="cal-warn"></div></div>

<!-- @messages -->
<div class="panel msgs"><h2>Messages <span id="mount-busy"></span></h2>
<div class="info" id="mount-msg">&mdash;</div></div>

<!-- @record -->
<div class="rec"><button id="recbtn"
 onclick="api('/api/record',{on: this.className!=='on' ? 1 : 0})">Start recording</button>
 <span id="recinfo">not recording</span></div>

<!-- @estop -->
<button id="estop" onclick="api('/api/estop',{})">EMERGENCY STOP</button>
<span id="estop-msg"></span>

<!-- @coming -->
<div class="panel box grow coming"><h2>Coming up</h2>
 <div class="ctl">
  <button title="bright satellites that will cross the guide field in the next hour - fixed on the stars if sidereal tracking is on"
  onclick="mnt('forecast',{mode:'field'})">through the guide field</button>
  <button title="the brightest passes anywhere above min_altitude and inside the sky openings, in the next hour"
  onclick="mnt('forecast',{mode:'sky'})">anywhere I can see</button></div>
 <div class="ctl"><button id="comingtrack" disabled title="plan and track the pass picked below, in pass mode - click a row to pick it and see its path on the sky chart"
  onclick="trackComing()">track selected</button><span id="coming-head" class="hint"></span></div>
 <div class="info" id="coming"></div></div>

<!-- @sky -->
<div class="panel sky">
<svg id="sky" viewBox="0 0 330 330"></svg>
<div class="info" id="sky-info"></div></div>
